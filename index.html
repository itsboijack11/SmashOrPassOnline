<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smash or Pass Multiplayer</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f4f4f9;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: white;
      max-width: 400px;
      margin: 20px auto;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .btn-container {
      display: flex;
      justify-content: space-around;
      margin-top: 20px;
    }
    button {
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      color: white;
      border: none;
      border-radius: 6px;
      transition: background 0.2s;
    }
    .btn-connect {
      background: #007bff;
      width: 100%;
      margin-top: 10px;
    }
    .btn-smash {
      background: #28a745;
    }
    .btn-smash:hover {
      background: #218838;
    }
    .btn-pass {
      background: #dc3545;
    }
    .btn-pass:hover {
      background: #c82333;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    input {
      padding: 8px;
      font-size: 16px;
      width: 70%;
    }
    .stats-board {
      font-size: 18px;
      margin: 15px 0;
      text-align: left;
    }
    .stats-board p {
      margin: 8px 0;
    }
  </style>
</head>
<body>

  <h1>Smash or Pass Counter</h1>

  <div class="card" id="setup-card">
    <h3>1. Connection Setup</h3>
    <p>Your Peer ID: <strong id="my-id">Connecting...</strong></p>
    
    <hr>
    
    <p>Join a Friend:</p>
    <input type="text" id="host-id-input" placeholder="Enter Friend's ID">
    <button class="btn-connect" onclick="connectToHost()">Connect</button>
  </div>

  <div class="card" id="game-card" style="display: none;">
    <h3>2. Cast Your Vote</h3>
    
    <div class="btn-container">
      <button class="btn-smash" id="smash-btn" onclick="registerVote('smash')">SMASH</button>
      <button class="btn-pass" id="pass-btn" onclick="registerVote('pass')">PASS</button>
    </div>

    <div class="stats-board">
      <hr>
      <p><strong>Your Stats:</strong></p>
      <p>Smashes: <span id="my-smashes">0</span> | Passes: <span id="my-passes">0</span></p>
      <hr>
      <p><strong>Opponent Stats:</strong></p>
      <p>Smashes: <span id="opp-smashes">0</span> | Passes: <span id="opp-passes">0</span></p>
    </div>
  </div>

  <script>
    let peer = new Peer();
    let conn = null;

    let myStats = { smash: 0, pass: 0 };
    let oppStats = { smash: 0, pass: 0 };

    // Display generated Peer ID
    peer.on('open', (id) => {
      document.getElementById('my-id').innerText = id;
    });

    // Handle incoming connections (Host side)
    peer.on('connection', (connection) => {
      conn = connection;
      setupConnection();
    });

    // Connect to another peer (Guest side)
    function connectToHost() {
      const hostId = document.getElementById('host-id-input').value.trim();
      if (hostId) {
        conn = peer.connect(hostId);
        setupConnection();
      }
    }

    // Bind event handlers to the active connection
    function setupConnection() {
      conn.on('open', () => {
        document.getElementById('setup-card').style.display = 'none';
        document.getElementById('game-card').style.display = 'block';
      });

      conn.on('data', (data) => {
        if (data.type === 'VOTE_UPDATE') {
          oppStats = data.stats;
          document.getElementById('opp-smashes').innerText = oppStats.smash;
          document.getElementById('opp-passes').innerText = oppStats.pass;
        }
      });
    }

    // Handle button clicks
    function registerVote(type) {
      if (type === 'smash') {
        myStats.smash++;
        document.getElementById('my-smashes').innerText = myStats.smash;
      } else if (type === 'pass') {
        myStats.pass++;
        document.getElementById('my-passes').innerText = myStats.pass;
      }

      // Send updated choices to peer live
      if (conn && conn.open) {
        conn.send({ type: 'VOTE_UPDATE', stats: myStats });
      }
    }
  </script>
</body>
</html>
